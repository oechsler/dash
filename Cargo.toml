[package]
name = "dash-rs"
version = "0.1.0"
edition = "2024"

[features]
default = ["postgres"]
postgres = [
    "sea-orm/sqlx-postgres",
    "sea-orm/runtime-tokio-rustls",
    "sea-orm-migration/sqlx-postgres",
    "sea-orm-migration/runtime-tokio-rustls",
]

[lib]
name = "dash"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
bon = "3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
getset = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
sea-orm = { version = "2", default-features = false, features = ["macros", "with-uuid", "with-chrono"] }
sea-orm-migration = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"

[dev-dependencies]
sea-orm = { version = "2", default-features = false, features = ["mock"] }

---
schemas:
  preferences:
    type: object
    required: [language, time_zone, selected_themes]
    examples:
      - language: en
        time_zone: Europe/Berlin
        selected_themes:
          light: null
          dark: 197fbdc4-92fd-4b18-b805-b2ad6d08aa92
    properties:
      language:
        $ref: '#/schemas/language'
      time_zone:
        type: string
        description: Choose your local time zone or let Dash detect it.
        example: Europe/Berlin
      selected_themes:
        type: object
        required: [light, dark]
        properties:
          light:
            type: [string, 'null']
            format: uuid
          dark:
            type: [string, 'null']
            format: uuid

  update_preferences:
    type: object
    additionalProperties: false
    minProperties: 1
    examples:
      - mode: dark
        theme_id: 197fbdc4-92fd-4b18-b805-b2ad6d08aa92
        language: en
        time_zone: Europe/Berlin
    properties:
      mode:
        $ref: './themes.yaml#/schemas/theme_mode'
      theme_id:
        type: [string, 'null']
        format: uuid
        description: Theme to use for this mode, or null to use the default.
      language:
        $ref: '#/schemas/language'
      time_zone:
        type: string
        description: Choose your local time zone or let Dash detect it.

  language:
    type: string
    enum: [auto, en, de]
    examples: [auto, en, de]

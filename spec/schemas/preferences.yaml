---
schemas:
  preferences:
    type: object
    additionalProperties: false
    required: [language, time_zone, selected_themes]
    examples:
      - language: en
        time_zone: Europe/Berlin
        selected_themes:
          light: null
          dark: 197fbdc4-92fd-4b18-b805-b2ad6d08aa92
    properties:
      language:
        $ref: '#/schemas/language'
      time_zone:
        type: string
        description: Choose your local time zone or let Dash detect it.
        example: Europe/Berlin
      selected_themes:
        type: object
        additionalProperties: false
        required: [light, dark]
        properties:
          light:
            type: [string, 'null']
            format: uuid
          dark:
            type: [string, 'null']
            format: uuid

  language:
    type: string
    enum: [auto, en, de]
    examples: [auto, en, de]

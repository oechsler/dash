components:
  securitySchemes:
    session_cookie:
      type: apiKey
      in: cookie
      name: dash_session
      description: Browser cookie Dash sets when you sign in.
    oidc_bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Send a Bearer access token for the signed-in user from any configured
        OpenID Connect provider. The server validates the configured issuer,
        audience, expiry, and signature. The token must include the scope
        required by the operation. Administrator actions also require
        membership in the configured administrator group.
      x-scopes:
        dash_user_read: View your profile.
        dash_user_delete: Delete your Dash account data.
        dash_dashboard_read: View your categories, bookmarks, and shared apps.
        dash_dashboard_write: >-
          Create, update, or remove categories and bookmarks.
        dash_applications_read: View the shared app catalog.
        dash_applications_write: Add, edit, or remove shared apps.
        dash_themes_read: View available themes.
        dash_themes_write: Create or delete your themes.
        dash_preferences_read: View your preferences.
        dash_preferences_write: Change your preferences.
        dash_sessions_read: View your signed-in devices.
        dash_sessions_write: End or update a device session.
        dash_transfer_read: Download a backup of your dashboard.
        dash_transfer_write: Restore your dashboard from a backup.
  parameters:
    category_id:
      name: category_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 1eec8b0f-4821-42d2-9323-5974cef94b4e
    bookmark_id:
      name: bookmark_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 25fe3a58-90d3-45a0-942d-216e8375d882
    application_id:
      name: application_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 34f5b56c-bf9a-4f05-8739-bc1d327f76a4
    theme_id:
      name: theme_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 197fbdc4-92fd-4b18-b805-b2ad6d08aa92
    session_id:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 6e06964a-67f9-4797-8bab-26219e354c1d
  responses:
    BadRequest:
      description: >-
        We couldn't understand the request. Check the values and try again.
      content:
        application/problem+json:
          schema:
            $ref: './schemas/common.yaml#/schemas/problem'
          examples:
            invalid_request:
              summary: A request contains invalid values
              value:
                type: about:blank
                title: Invalid request
                status: 400
                code: invalid_request
                message: Check the request values and try again.
    Unauthorized:
      description: Sign in to continue.
      content:
        application/problem+json:
          schema:
            $ref: './schemas/common.yaml#/schemas/problem'
          examples:
            sign_in_required:
              summary: No active sign-in
              value:
                type: about:blank
                title: Sign-in required
                status: 401
                code: unauthenticated
                message: Sign in to continue.
    Forbidden:
      description: You don't have permission to make this change.
      content:
        application/problem+json:
          schema:
            $ref: './schemas/common.yaml#/schemas/problem'
          examples:
            not_allowed:
              summary: The action is not allowed
              value:
                type: about:blank
                title: Not allowed
                status: 403
                code: forbidden
                message: You don't have permission to make this change.
    NotFound:
      description: We couldn't find that item.
      content:
        application/problem+json:
          schema:
            $ref: './schemas/common.yaml#/schemas/problem'
          examples:
            missing_item:
              summary: The requested item does not exist
              value:
                type: about:blank
                title: Not found
                status: 404
                code: not_found
                message: We couldn't find that item.
    Conflict:
      description: >-
        This change can't be made while the item is in its current state.
      content:
        application/problem+json:
          schema:
            $ref: './schemas/common.yaml#/schemas/problem'
          examples:
            item_in_use:
              summary: An item can't be changed in its current state
              value:
                type: about:blank
                title: Change not allowed
                status: 409
                code: item_in_use
                message: This change can't be made while the item is in use.
    ValidationError:
      description: One or more values need to be corrected.
      content:
        application/problem+json:
          schema:
            $ref: './schemas/common.yaml#/schemas/problem'
          examples:
            invalid_field:
              summary: A field needs correction
              value:
                type: about:blank
                title: Check your details
                status: 422
                code: validation_error
                message: Enter a valid category name and try again.
    InternalError:
      description: Something went wrong while handling the request.
      content:
        application/problem+json:
          schema:
            $ref: './schemas/common.yaml#/schemas/problem'
          examples:
            server_problem:
              summary: An unexpected error occurred
              value:
                type: about:blank
                title: Something went wrong
                status: 500
                code: internal_error
                message: Try again in a moment.
security:
  - session_cookie: []
  - oidc_bearer: []

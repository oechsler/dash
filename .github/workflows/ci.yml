name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dash
          POSTGRES_PASSWORD: dash
          POSTGRES_DB: dash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dash -d dash_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DASH_TEST_DATABASE_URL: postgres://dash:dash@localhost:5432/dash_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --test postgres_integration -- --ignored
      - run: cargo check --no-default-features
